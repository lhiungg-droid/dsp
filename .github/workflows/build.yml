name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Custom Icon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install ImageMagick and rsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install npm dependencies
        run: npm install

      - name: Init Capacitor
        run: |
          npx cap init "DSP Console" com.dsp.console --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Generate App Icons from SVG
        run: bash .github/scripts/generate-icons.sh

      - name: Fix Android Build Config
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 22/' android/variables.gradle || true

      - name: Set App Name
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">DSP Console</string>|g' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">DSP Console</string>|g' android/app/src/main/res/values/strings.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: dsp-console-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 0
