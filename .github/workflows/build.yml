name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Custom Icon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install ImageMagick (for icon generation)
        run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin

      - name: Install npm dependencies
        run: npm install

      - name: Init Capacitor
        run: |
          npx cap init "DSP Console" com.dsp.console --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Generate App Icons from SVG
        run: |
          # Buat folder kalau belum ada
          mkdir -p www/icons

          # Generate semua ukuran ikon dari SVG
          # Sumber: www/icon.svg
          if [ -f www/icon.svg ]; then
            echo "SVG logo ditemukan, generating icons..."

            # Master icon 1024x1024
            rsvg-convert -w 1024 -h 1024 www/icon.svg -o www/icons/icon-1024.png

            # Generate ukuran untuk PWA
            rsvg-convert -w 512 -h 512 www/icon.svg -o www/icons/icon-512.png
            rsvg-convert -w 192 -h 192 www/icon.svg -o www/icons/icon-192.png
            rsvg-convert -w 144 -h 144 www/icon.svg -o www/icons/icon-144.png
            rsvg-convert -w 96  -h 96  www/icon.svg -o www/icons/icon-96.png
            rsvg-convert -w 72  -h 72  www/icon.svg -o www/icons/icon-72.png

            # Generate untuk Android mipmap
            MIPMAP_DIR=android/app/src/main/res
            mkdir -p $MIPMAP_DIR/mipmap-mdpi
            mkdir -p $MIPMAP_DIR/mipmap-hdpi
            mkdir -p $MIPMAP_DIR/mipmap-xhdpi
            mkdir -p $MIPMAP_DIR/mipmap-xxhdpi
            mkdir -p $MIPMAP_DIR/mipmap-xxxhdpi

            rsvg-convert -w 48  -h 48  www/icon.svg -o $MIPMAP_DIR/mipmap-mdpi/ic_launcher.png
            rsvg-convert -w 48  -h 48  www/icon.svg -o $MIPMAP_DIR/mipmap-mdpi/ic_launcher_round.png
            rsvg-convert -w 72  -h 72  www/icon.svg -o $MIPMAP_DIR/mipmap-hdpi/ic_launcher.png
            rsvg-convert -w 72  -h 72  www/icon.svg -o $MIPMAP_DIR/mipmap-hdpi/ic_launcher_round.png
            rsvg-convert -w 96  -h 96  www/icon.svg -o $MIPMAP_DIR/mipmap-xhdpi/ic_launcher.png
            rsvg-convert -w 96  -h 96  www/icon.svg -o $MIPMAP_DIR/mipmap-xhdpi/ic_launcher_round.png
            rsvg-convert -w 144 -h 144 www/icon.svg -o $MIPMAP_DIR/mipmap-xxhdpi/ic_launcher.png
            rsvg-convert -w 144 -h 144 www/icon.svg -o $MIPMAP_DIR/mipmap-xxhdpi/ic_launcher_round.png
            rsvg-convert -w 192 -h 192 www/icon.svg -o $MIPMAP_DIR/mipmap-xxxhdpi/ic_launcher.png
            rsvg-convert -w 192 -h 192 www/icon.svg -o $MIPMAP_DIR/mipmap-xxxhdpi/ic_launcher_round.png

            # Adaptive icon (foreground)
            mkdir -p $MIPMAP_DIR/mipmap-anydpi-v26
            cat > $MIPMAP_DIR/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>
EOF
            cp $MIPMAP_DIR/mipmap-anydpi-v26/ic_launcher.xml $MIPMAP_DIR/mipmap-anydpi-v26/ic_launcher_round.xml

            # Foreground icon untuk adaptive
            for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $dpi in
                mdpi)    SIZE=108;;
                hdpi)    SIZE=162;;
                xhdpi)   SIZE=216;;
                xxhdpi)  SIZE=324;;
                xxxhdpi) SIZE=432;;
              esac
              rsvg-convert -w $SIZE -h $SIZE www/icon.svg -o $MIPMAP_DIR/mipmap-$dpi/ic_launcher_foreground.png
            done

            # Background color untuk adaptive icon
            mkdir -p $MIPMAP_DIR/values
            if ! grep -q "ic_launcher_background" $MIPMAP_DIR/values/colors.xml 2>/dev/null; then
              cat > $MIPMAP_DIR/values/colors.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#0a0b0d</color>
</resources>
EOF
            fi

            echo "Ikon berhasil di-generate!"
            ls -lh $MIPMAP_DIR/mipmap-xxxhdpi/
          else
            echo "www/icon.svg tidak ditemukan - pakai ikon default"
          fi

      - name: Fix Android Build Config
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 22/' android/variables.gradle || true

      - name: Set App Name
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">DSP Console</string>|g' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">DSP Console</string>|g' android/app/src/main/res/values/strings.xml
          cat android/app/src/main/res/values/strings.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: dsp-console-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 0
